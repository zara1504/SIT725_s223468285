<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wishing Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css"/>
</head>
<body>
  <div class="sky" id="sky">
    <div class="moon"></div>
  </div>

  <div class="ui-overlay">
    <header>
      <h1>Wishing Wall</h1>
      <p class="subtitle">Write a wish. Let it become a star.</p>
    </header>

    <div class="wish-form">
      <textarea id="wish-input" placeholder="I wish…" maxlength="80"></textarea>
      <div class="form-footer">
        <span id="char-count">80</span>
        <button id="wish-btn">Release ✦</button>
      </div>
    </div>

    <div class="meta">
      <span id="wish-count">0 wishes in the sky</span>
      <button id="shoot-btn" title="Send a shooting star!">Shooting star</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
